name: Predict

on:
  schedule:
    # Hourly during the season (Sep-Feb). The gate exits in seconds unless a run is due.
    - cron: "17 * * 1,2,9,10,11,12 *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Force a run type (empty = let the gate decide)"
        type: choice
        options: ["", "midweek", "final_injury", "gameday"]
        default: ""
      publish_only:
        description: "Rebuild and deploy the site without running a prediction"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "seahawks_ml/site/**"
      - "models/metrics.json"
      - "models/backtest.json"
      - "models/holdout.json"

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    env:
      PUBLISH_ONLY: ${{ github.event_name == 'push' || inputs.publish_only == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - id: predict
        if: env.PUBLISH_ONLY != 'true'
        env:
          RUN_TYPE: ${{ inputs.run_type }}
        run: uv run python -m seahawks_ml.cli predict ${RUN_TYPE:+--run-type "$RUN_TYPE"}
      - name: Commit prediction log and data cache
        if: steps.predict.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/ data/cache/
          git diff --cached --quiet || git commit -m "predict: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - id: publish
        name: Decide whether to publish
        env:
          CHANGED: ${{ steps.predict.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ] || [ "$PUBLISH_ONLY" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        if: steps.publish.outputs.publish == 'true'
        run: uv run python -m seahawks_ml.cli build-site
      - uses: actions/upload-pages-artifact@v5
        if: steps.publish.outputs.publish == 'true'
        with:
          path: public

  deploy:
    needs: predict
    if: needs.predict.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
