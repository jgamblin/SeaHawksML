name: Predict

on:
  schedule:
    # Asks for every 15 minutes during the season (Sep-Feb), off the busy :00/:30 marks. In practice
    # GitHub fires these only every few hours, so the `gameday` job below waits in-job for the
    # short Seahawks gameday window when it opens soon.
    # The gate exits in seconds unless a run is due; the season
    # simulation (predictions/season_sim.jsonl) runs once per "sim day" (starting 10:00 UTC), on the
    # first run of that sim day.
    - cron: "7,22,37,52 * * 1,2,9,10,11,12 *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Force a run type (empty = let the gate decide)"
        type: choice
        options: ["", "midweek", "final_injury", "gameday"]
        default: ""
      publish_only:
        description: "Rebuild and deploy the site without running a prediction"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "seahawks_ml/site/**"
      - "models/metrics.json"
      - "models/backtest.json"
      - "models/holdout.json"

concurrency:
  group: ${{ (github.event_name == 'push' || inputs.publish_only) && 'publish' || 'repo-writes' }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    env:
      PUBLISH_ONLY: ${{ github.event_name == 'push' || inputs.publish_only == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - id: predict
        if: env.PUBLISH_ONLY != 'true'
        env:
          RUN_TYPE: ${{ inputs.run_type }}
        run: uv run python -m seahawks_ml.cli predict ${RUN_TYPE:+--run-type "$RUN_TYPE"}
      - name: Commit prediction log and data cache
        if: ${{ !cancelled() && steps.predict.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/ data/cache/
          git diff --cached --quiet || git commit -m "predict: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - id: publish
        name: Decide whether to publish
        env:
          CHANGED: ${{ steps.predict.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ] || [ "$PUBLISH_ONLY" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        if: steps.publish.outputs.publish == 'true'
        run: uv run python -m seahawks_ml.cli build-site
      - uses: actions/upload-pages-artifact@v5
        if: steps.publish.outputs.publish == 'true'
        with:
          path: public

  deploy:
    needs: predict
    if: needs.predict.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub fires scheduled runs only every few hours, which can miss the ~5h Seahawks gameday
  # window. If it opens within 5.5h, this job waits for it (after the run above has published),
  # then predicts and publishes again.
  gameday:
    needs: [predict, deploy]
    if: ${{ !cancelled() && github.event_name != 'push' && inputs.publish_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.predict.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - id: wait
        run: uv run python -m seahawks_ml.cli wait-for-gameday --max-hours 5.5
      - id: predict
        if: steps.wait.outputs.waited == 'true'
        run: |
          git pull --rebase
          uv run python -m seahawks_ml.cli predict
      - name: Commit gameday prediction
        if: ${{ !cancelled() && steps.predict.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/ data/cache/
          git diff --cached --quiet || git commit -m "predict: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - name: Build site
        if: steps.predict.outputs.changed == 'true'
        run: uv run python -m seahawks_ml.cli build-site
      - uses: actions/upload-pages-artifact@v5
        if: steps.predict.outputs.changed == 'true'
        with:
          path: public
          name: github-pages-gameday

  deploy-gameday:
    needs: gameday
    if: needs.gameday.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-gameday

  notify-failure:
    needs: [predict, deploy, gameday, deploy-gameday]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - name: Open or update a failure issue
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --label workflow-failure --state open \
            --search "in:title \"$WORKFLOW_NAME\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh label create workflow-failure --repo "${{ github.repository }}" --color B60205 --force
            gh issue create --repo "${{ github.repository }}" --label workflow-failure \
              --title "Scheduled workflow failing: $WORKFLOW_NAME" --body "The scheduled run failed: $RUN_URL"
          fi
