name: Predict

on:
  schedule:
    # Hourly during the season (Sep-Feb). The gate exits in seconds unless a run is due; the season
    # simulation (predictions/season_sim.jsonl) runs once per "sim day" (starting 10:00 UTC), attempted on
    # runs that already load data, or at 10/14/18/22 UTC when nothing else is due.
    - cron: "17 * * 1,2,9,10,11,12 *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Force a run type (empty = let the gate decide)"
        type: choice
        options: ["", "midweek", "final_injury", "gameday"]
        default: ""
      publish_only:
        description: "Rebuild and deploy the site without running a prediction"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "seahawks_ml/site/**"
      - "models/metrics.json"
      - "models/backtest.json"
      - "models/holdout.json"

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    env:
      PUBLISH_ONLY: ${{ github.event_name == 'push' || inputs.publish_only == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - id: predict
        if: env.PUBLISH_ONLY != 'true'
        env:
          RUN_TYPE: ${{ inputs.run_type }}
        run: uv run python -m seahawks_ml.cli predict ${RUN_TYPE:+--run-type "$RUN_TYPE"}
      - name: Commit prediction log and data cache
        if: ${{ !cancelled() && steps.predict.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/ data/cache/
          git diff --cached --quiet || git commit -m "predict: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - id: publish
        name: Decide whether to publish
        env:
          CHANGED: ${{ steps.predict.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ] || [ "$PUBLISH_ONLY" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        if: steps.publish.outputs.publish == 'true'
        run: uv run python -m seahawks_ml.cli build-site
      - uses: actions/upload-pages-artifact@v5
        if: steps.publish.outputs.publish == 'true'
        with:
          path: public

  deploy:
    needs: predict
    if: needs.predict.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify-failure:
    needs: [predict, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - name: Open or update a failure issue
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --label workflow-failure --state open \
            --search "in:title \"$WORKFLOW_NAME\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh label create workflow-failure --repo "${{ github.repository }}" --color B60205 --force
            gh issue create --repo "${{ github.repository }}" --label workflow-failure \
              --title "Scheduled workflow failing: $WORKFLOW_NAME" --body "The scheduled run failed: $RUN_URL"
          fi
