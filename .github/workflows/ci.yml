name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["predictions/**", "data/cache/**", "data/features/**", "models/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest
