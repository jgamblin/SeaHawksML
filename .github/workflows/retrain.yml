name: Retrain

on:
  schedule:
    # Tuesdays 14:00 UTC during the season: refit weights with the locked config.
    - cron: "0 14 * 1,2,9,10,11,12 2"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run python -m seahawks_ml.cli retrain
      - name: Commit model, metrics and data cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/model.pkl models/metrics.json data/cache/ data/features/
          git diff --cached --quiet || git commit -m "retrain: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
      - name: Redeploy dashboard
        # Pushes made with GITHUB_TOKEN do not trigger push workflows, so publish explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run predict.yml -f publish_only=true

  notify-failure:
    needs: [retrain]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - name: Open or update a failure issue
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --label workflow-failure --state open \
            --search "in:title \"$WORKFLOW_NAME\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh label create workflow-failure --repo "${{ github.repository }}" --color B60205 --force
            gh issue create --repo "${{ github.repository }}" --label workflow-failure \
              --title "Scheduled workflow failing: $WORKFLOW_NAME" --body "The scheduled run failed: $RUN_URL"
          fi
