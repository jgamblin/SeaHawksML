name: Retrain

on:
  schedule:
    # Tuesdays 14:00 UTC during the season: refit weights with the locked config.
    - cron: "0 14 * 1,2,9,10,11,12 2"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run python -m seahawks_ml.cli retrain
      - name: Commit model, metrics and data cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/model.pkl models/metrics.json data/cache/ data/features/
          git diff --cached --quiet || git commit -m "retrain: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
      - name: Redeploy dashboard
        # Pushes made with GITHUB_TOKEN do not trigger push workflows, so publish explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run predict.yml -f publish_only=true
